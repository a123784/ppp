  <!-- 1. SEO Title (50–60 characters ke andar rakhein, brand name sabse aage) -->
  <title>Aapka Brand Name - Aapki Website Ki Tagline</title>

  <!-- 2. Meta Description (140–160 characters ke andar rakhein) -->
  <meta name="description" content="Aapka Brand Name par aapko [aapki service/product/content] milta hai. Yahan 1-2 line mein batayein ki aapki site kis baare mein hai." />

  <!-- 3. Canonical URL (Duplicate URL issues se bachne ke liye) -->
  <link rel="canonical" href="https://aapki-website-ka-url.com/" />

  <!-- 4. Open Graph Tags (Social media aur Google ko site name samjhane ke liye) -->
  <meta property="og:site_name" content="Aapka Brand Name" />
  <meta property="og:title" content="Aapka Brand Name - Aapki Website Ki Tagline" />
  <meta property="og:description" content="Aapka Brand Name par aapko [aapki service/product/content] milta hai." />
  <meta property="og:url" content="https://aapki-website-ka-url.com/" />
  <meta property="og:type" content="website" />

  <!-- 5. Google Site Name ke liye WebSite Schema (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Aapka Brand Name",
    "alternateName": ["Short Name", "Brand Name"],
    "url": "https://aapki-website-ka-url.com/"
  }
  </script>
</head>
